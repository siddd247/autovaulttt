[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autovault"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Werkzeug>=3.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["instance*", "tests*", "static*"]

[tool.setuptools]
py-modules = ["wsgi", "config", "seed"]

[tool.vercel]
entrypoint = "wsgi:app"
